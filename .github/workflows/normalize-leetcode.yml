name: Normalize LeetCode

on:
  push:
    branches:
      - main
      - master
    paths:
      - "[0-9][0-9][0-9][0-9]-*/**"
      - "README.md"
      - ".github/scripts/normalize-leetcode.sh"
      - ".github/workflows/normalize-leetcode.yml"

permissions:
  contents: write

concurrency:
  group: normalize-leetcode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Update branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Normalize LeetCode files
        run: bash .github/scripts/normalize-leetcode.sh

      - name: Commit normalized layout
        run: |
          if git diff --quiet; then
            echo "No LeetCode layout changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize LeetCode directory layout"
          git push
